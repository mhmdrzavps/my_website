<section class="top-category-widget-area pt-90 pb-90 ">
	<div class="container">
		<div class="row">
			{% for post in posts %}
			<div class="col-lg-4">
				<div class="single-cat-widget">
					<div class="content relative">
						<div class="overlay overlay-bg"></div>
						<a href="{% url 'blog:single' pid=post.id %}">
							<div class="thumb">
								<img class="content-image img-fluid d-block mx-auto" src="{{post.image.url}}" alt="">
							</div>
							<div class="content-details">
								{% for cat in post.category.all %}
								<h4 class="content-title mx-auto text-uppercase">{{cat.name}}</h4>
								{% endfor %}
								<span></span>
								<p>{{post.title}}</p>
							</div>
						</a>
					</div>
				</div>
			</div>
			{% endfor %}

		</div>
	</div>
</section>
